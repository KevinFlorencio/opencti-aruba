; MISP session handler override for the single-container deployment.
; The image writes session.save_handler=redis into php.ini with an auth query
; string that phpredis' session handler rejects on this build, which makes every
; request that touches a session return HTTP 500. File sessions are sufficient
; for one misp-core container and avoid the failure mode.
session.save_handler = files
session.save_path = "/var/lib/php/sessions"
