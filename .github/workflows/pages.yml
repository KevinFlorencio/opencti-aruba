name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild when the UTC calendar year changes.
    - cron: '23 0 1 1 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kevinflorencio.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/opencti-aruba' }}

      - name: Verify published content
        working-directory: site
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
