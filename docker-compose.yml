name: opencti-aruba

x-opencti-common: &opencti-common
  OPENCTI_URL: http://opencti:8080
  OPENCTI_TOKEN: ${OPENCTI_ADMIN_TOKEN}
  CONNECTOR_LOG_LEVEL: info
  CONNECTOR_RUN_AND_TERMINATE: "false"

services:
  redis:
    image: redis:8.10.1
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    restart: always
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.ml.enabled=false
      - xpack.security.enabled=false
      - thread_pool.search.queue_size=5000
      - logger.org.elasticsearch.discovery=ERROR
      - "ES_JAVA_OPTS=-Xms${ELASTIC_MEMORY_SIZE} -Xmx${ELASTIC_MEMORY_SIZE}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  minio:
    image: pgsty/silo:latest
    restart: always
    command: server /data --console-address ":9001"
    volumes:
      - s3data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODENAME=rabbit01@localhost
    volumes:
      - amqpdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 20s
      retries: 10
      start_period: 40s

  opencti:
    image: opencti/platform:7.261103.0
    restart: always
    environment:
      - NODE_OPTIONS=--max-old-space-size=6144
      - APP__PORT=8080
      - APP__BASE_URL=${OPENCTI_BASE_URL}
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN}
      - APP__ENCRYPTION_KEY=${OPENCTI_ENCRYPTION_KEY}
      - APP__HEALTH_ACCESS_KEY=${OPENCTI_HEALTHCHECK_ACCESS_KEY}
      - APP__TELEMETRY__ENABLED=false
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO__SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health?health_access_key=${OPENCTI_HEALTHCHECK_ACCESS_KEY}"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  worker:
    image: opencti/worker:7.261103.0
    restart: always
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - WORKER_LOG_LEVEL=info
    deploy:
      mode: replicated
      replicas: 2
    depends_on:
      opencti:
        condition: service_healthy

  # ── Internal enrichment / import ─────────────────────────────
  connector-import-document:
    image: opencti/connector-import-document:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: a5ed6a96-478f-4963-8f96-36ba1ef1cbd9
      CONNECTOR_TYPE: INTERNAL_IMPORT_FILE
      CONNECTOR_NAME: ImportDocument
      CONNECTOR_VALIDATE_BEFORE_IMPORT: "true"
      CONNECTOR_SCOPE: application/pdf,text/plain,text/html
      CONNECTOR_AUTO: "true"
      CONNECTOR_ONLY_CONTEXTUAL: "false"
      IMPORT_DOCUMENT_CREATE_INDICATOR: "true"
    depends_on:
      opencti:
        condition: service_healthy

  connector-export-stix:
    image: opencti/connector-export-file-stix:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: 6c7566e3-9665-48cc-bde9-68b24d652c38
      CONNECTOR_TYPE: INTERNAL_EXPORT_FILE
      CONNECTOR_NAME: ExportFileStix2
      CONNECTOR_SCOPE: application/json
    depends_on:
      opencti:
        condition: service_healthy

  # ── Knowledge sources ────────────────────────────────────────
  connector-opencti:
    image: opencti/connector-opencti:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: 720b2855-f4d4-428d-a147-f49ee22b250f
      CONNECTOR_NAME: OpenCTI Datasets
      CONNECTOR_SCOPE: marking-definition,identity,location
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "100"
    depends_on:
      opencti:
        condition: service_healthy

  connector-mitre:
    image: opencti/connector-mitre:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: 07806e0b-d990-4883-9501-b5a4f0c4b81f
      CONNECTOR_NAME: MITRE ATT&CK
      CONNECTOR_SCOPE: mitre
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT: "true"
      CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL: "75"
    depends_on:
      opencti:
        condition: service_healthy

  connector-mitre-atlas:
    image: opencti/connector-mitre-atlas:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: 68e115b9-1e0e-44cf-8138-33e0cafc641f
      CONNECTOR_NAME: MITRE ATLAS
      CONNECTOR_SCOPE: mitre-atlas
      CONNECTOR_DURATION_PERIOD: PT24H
    depends_on:
      opencti:
        condition: service_healthy

  connector-cisa-kev:
    image: opencti/connector-cisa-known-exploited-vulnerabilities:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: b69aede6-e979-4281-bf5b-d9c38e738697
      CONNECTOR_NAME: CISA KEV
      CONNECTOR_SCOPE: cisa
      CONNECTOR_DURATION_PERIOD: PT6H
      CISA_TLP: TLP:CLEAR
    depends_on:
      opencti:
        condition: service_healthy

  connector-misp:
    image: opencti/connector-misp:latest
    restart: always
    environment:
      <<: *opencti-common
      CONNECTOR_ID: 2fd518f7-e91d-4999-967e-a0fd5d6bc6c3
      CONNECTOR_NAME: MISP
      CONNECTOR_SCOPE: misp
      CONNECTOR_DURATION_PERIOD: PT15M
      MISP_URL: ${MISP_URL}
      MISP_KEY: ${MISP_API_KEY}
      MISP_SSL_VERIFY: "false"
      MISP_CREATE_REPORTS: "true"
      MISP_CREATE_INDICATORS: "true"
      MISP_CREATE_OBSERVABLES: "true"
      MISP_CREATE_OBJECT_OBSERVABLES: "true"
      MISP_CREATE_TAGS_AS_LABELS: "true"
      MISP_REPORT_TYPE: misp-event
      MISP_IMPORT_FROM_DATE: "2025-06-01"
      MISP_IMPORT_DISTRIBUTION_LEVELS: "0,1,2,3"
      MISP_IMPORT_THREAT_LEVELS: "1,2,3,4"
      MISP_IMPORT_ONLY_PUBLISHED: "false"
      MISP_ENFORCE_WARNING_LIST: "true"
      MISP_THREAT_LEVEL_SCORE_MAPPING: "1:90;2:60;3:30;4:50"
      MISP_IMPORT_UNSUPPORTED_OBSERVABLES_AS_TEXT: "true"
    depends_on:
      opencti:
        condition: service_healthy

  # ── Reverse proxy / static site ──────────────────────────────
  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - ./site/dist:/srv/radar:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      opencti:
        condition: service_healthy

volumes:
  esdata:
  s3data:
  redisdata:
  amqpdata:
  caddydata:
  caddyconfig:
